name: Collect Astana route observations
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: route-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect raw measurements
        id: collect
        env:
          ORS_KEY: ${{ secrets.ORS_KEY }}
        run: python collector/collect.py --mode scheduled
      - name: Commit observations
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/collection_state.json docs/research_log.md
          if ! git diff --cached --quiet; then
            git commit -m "Record scheduled route observations"
            git push origin HEAD:main
          fi
      - name: Disable schedule after collection window
        if: steps.collect.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable collect.yml
